<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAST SONG!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <canvas id="game" width="320" height="180"></canvas>
    <img id="guitarist-image" class="member-source" src="assets/band/guitarist.png" alt="" hidden />
    <img id="vocalist-image" class="member-source" src="assets/band/vocalist.png" alt="" hidden />
    <img id="drummer-image" class="member-source" src="assets/band/drummer.png" alt="" hidden />
    <img id="drummer-panic-image" class="member-source" src="assets/band/drummer-panic.png" alt="" hidden />
    <div id="band" class="band">
      <label>보컬<canvas data-who="vocal" width="16" height="24"></canvas></label>
      <label>기타1<canvas data-who="guitar1" width="16" height="24"></canvas></label>
      <div class="band-flex">
        <label>기타2/베이스/키보드<canvas data-who="flex" width="16" height="24"></canvas></label>
        <div class="roles">
          <button type="button" data-role="guitar2">기타2</button>
          <button type="button" data-role="bass" aria-pressed="true">베이스</button>
          <button type="button" data-role="keys">키보드</button>
        </div>
      </div>
      <label>드럼<canvas data-who="drum" width="16" height="24"></canvas></label>
      <button type="button" data-reset>기본</button>
    </div>
    <p class="hint">A/D 무대 선택 · SPACE 시작 · WASD 이동 · E 집기 · Q 버리기 · 전선은 드래그 또는 WASD+E</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
