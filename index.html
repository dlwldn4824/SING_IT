<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAST SONG!</title>
  <link rel="stylesheet" href="style.css?v=worker-side-fix-7ee8336" />
</head>
<body>
  <main>
    <canvas id="game" width="320" height="180"></canvas>
    <img id="guitarist-image" class="member-source" src="assets/band/guitarist.png" alt="" hidden />
    <img id="vocalist-image" class="member-source" src="assets/band/vocalist.png" alt="" hidden />
    <img id="drummer-image" class="member-source" src="assets/band/drummer.png" alt="" hidden />
    <img id="drummer-panic-image" class="member-source" src="assets/band/drummer-panic.png" alt="" hidden />
    <img id="bassist-image" class="member-source" src="assets/band/bassist.png" alt="" hidden />
    <img id="keyboardist-image" class="member-source" src="assets/band/keyboardist.png" alt="" hidden />
    <img id="player-worker-sheet" class="member-source" src="assets/band/player-worker-sheet.png" alt="" hidden />
    <div id="band" class="band">
      <label>보컬<img class="band-member" src="assets/band/vocalist.png" alt="보컬" /></label>
      <label>기타1<img class="band-member" src="assets/band/guitarist.png" alt="기타" /></label>
      <label>베이스<img class="band-member" src="assets/band/bassist.png" alt="베이스" /></label>
      <label>키보드<img class="band-member" src="assets/band/keyboardist.png" alt="키보드" /></label>
      <label>드럼<img class="band-member" src="assets/band/drummer.png" alt="드럼" /></label>
    </div>
    <p class="hint">A/D 무대 선택 · SPACE 시작 · WASD 이동 · E 집기 · Q 버리기 · 전선은 드래그 또는 WASD+E</p>
  </main>
  <script type="module" src="src/main.js?v=worker-side-fix-7ee8336"></script>
</body>
</html>
